<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./cryptocurrency_style.css">
</head>
<body class="bg-light">

    <main class="container my-5">

        <h1 class="text-center fw-bold mb-4">
            실시간 암호화폐 가격 변동 추적기
        </h1>

        <div class="d-flex justify-content-center gap-2 mb-4">
            <button id="allTab" class="btn btn-dark">전체보기</button>
            <button id="favoritesTab" class="btn btn-outline-dark">관심항목</button>
        </div>

        <div class="mb-4 mx-auto" style="max-width: 400px;">
            <input type="text" id="searchInput" class="form-control" placeholder="심볼 검색 (예: BTCUSDT)">
        </div>

        <p id="loading" class="text-center">데이터를 불러오는 중...</p>

        <div class="table-responsive">
            <table id="cryptoTable" class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>관심</th>
                        <th>심볼</th>
                        <th>현재가</th>
                        <th>24시간 변동률</th>
                        <th>최고가</th>
                        <th>최저가</th>
                    </tr>
                </thead>
                <tbody id="cryptoList">
                    <!-- js로 데이터 추가 -->
                </tbody>
            </table>
        </div>

        <div id="scrollTrigger" class="text-center py-4"></div>
    </main>
    
    <script src="./cryptocurrency.js"></script>
</body>
</html>
