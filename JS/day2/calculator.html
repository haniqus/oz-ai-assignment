<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light min-vh-100 d-flex align-items-center justify-content-center">
    <main class="container" style="max-width: 560px;">
        <div class="card bg-black text-light border-secondary shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
                <span class="badge text-bg-secondary mb-3">JAVASCRIPT · CONSOLE</span>
                <h1 class="fw-bold mb-2">Calculator<span class="text-secondary">.</span></h1>
                <p class="text-secondary mb-4">사칙연산 계산기 | +, -, *, /</p>
                <div class="bg-dark rounded-3 p-3 mb-4 font-monospace">
                    <div class="text-secondary small mb-2">EXAMPLE</div>
                    <div>1 + 2 * 3 <span class="text-secondary">→</span> 7</div>
                    <div>10/2+3 <span class="text-secondary">→</span> 8</div>
                </div>

                <button class="btn btn-light" onclick="start()">
                    계산기 실행
                </button>

            </div>
        </div>
        <p class="text-center text-secondary small mt-3">Spaces are optional. Multiplication and division come first.</p>
    </main>
    <script src="./calculator.js"></script>
</body>
</html>
